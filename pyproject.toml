[project]
name = "finsight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "duckdb>=1.5.6",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
parse = [
    "docling>=2.130.0",
]
ui = [
    "streamlit>=1.64.0",
]
models = [
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "eval", "ui", "warehouse", "models", "signals", "risk", "recs"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs downloaded filings and local models (deselect with -m 'not integration')"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
